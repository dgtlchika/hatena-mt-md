[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hatena-mt-md"
version = "0.1.0"
description = "はてなブログのMT形式エクスポートを記事ごとのMarkdownへ変換するCLI（標準ライブラリのみ）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dgtlchika" }]
keywords = ["hatena", "hatenablog", "movabletype", "markdown", "migration", "export"]

[project.scripts]
hatena-mt-md = "hatena_mt_md:main"

[tool.setuptools]
py-modules = ["hatena_mt_md"]
